<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate with scripts/brand/render.sh -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background: #fafaf9; color: #1c1917; position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(28,25,23,.10) 1px, transparent 0);
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 30% 40%, #000 30%, transparent 80%);
      }
      .glow { position: absolute; width: 640px; height: 640px; right: -180px; top: -260px; border-radius: 50%; background: rgba(15,118,110,.18); filter: blur(80px); }
      .wrap { position: relative; display: flex; height: 100%; padding: 80px; gap: 64px; align-items: center; }
      .text { flex: 1; }
      .eyebrow { font-family: Consolas, ui-monospace, monospace; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: #0f766e; }
      h1 { font-size: 92px; line-height: 1; letter-spacing: -.04em; margin-top: 20px; font-weight: 800; }
      p { font-size: 30px; line-height: 1.4; color: #57534e; margin-top: 28px; max-width: 640px; }
      .foot { display: flex; gap: 14px; margin-top: 44px; }
      .pill { font-size: 20px; padding: 8px 18px; border-radius: 999px; border: 1px solid #e7e5e4; background: #fff; color: #57534e; }
      .photo { width: 300px; height: 360px; border-radius: 24px; object-fit: cover; object-position: 50% 25%; box-shadow: 0 30px 60px -20px rgba(28,25,23,.35); }
      .frame { position: relative; }
      .frame::before { content: ""; position: absolute; inset: 0; transform: translate(14px, 14px); border: 2px solid rgba(15,118,110,.45); border-radius: 24px; }
      .url { position: absolute; left: 80px; bottom: 40px; font-family: Consolas, ui-monospace, monospace; font-size: 22px; color: #57534e; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="wrap">
      <div class="text">
        <div class="eyebrow">Software Developer · Melbourne</div>
        <h1>Thang Truong</h1>
        <p>I build and ship web apps end to end: React &amp; TypeScript, Node.js APIs and AWS infrastructure.</p>
        <div class="foot">
          <span class="pill">FrontEnd</span><span class="pill">BackEnd</span><span class="pill">FullStack</span><span class="pill">DevOps</span>
        </div>
      </div>
      <div class="frame"><img class="photo" src="../../src/assets/TT-Photo.webp" alt="" /></div>
    </div>
    <div class="url">thang-truong.blog</div>
  </body>
</html>
